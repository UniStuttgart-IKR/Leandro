[workspace]
resolver = "2"
members = [
    "crates/nvrm-sys", "crates/nvrm-abi", "crates/nvrm-client",
    "crates/nvrm-wire", "crates/nvrm-trace", "crates/vhost-user-nvrm",
    "crates/xtask",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
rust-version = "1.82"

[workspace.dependencies]
libc = "0.2"
anyhow = "1"
thiserror = "2"
bindgen = "0.71"

# The vhost-user device side. vhost 0.17 is the first release that places
# VHOST_USER_PROTOCOL_F_SHMEM at the specified bit 22 (0.16 used bit 21, which the
# specification assigns to GPA_ADDRESSES). The patched cloud-hypervisor frontend uses
# vhost 0.17 as well (patches/0001); vhost-user-backend 0.23, virtio-queue 0.18 and
# vm-memory 0.18 are the versions vhost 0.17 requires.
vhost = { version = "0.17", features = ["vhost-user-backend"] }
vhost-user-backend = "0.23"
virtio-queue = "0.18"
vm-memory = "0.18"
vmm-sys-util = "0.15"

nvrm-sys   = { path = "crates/nvrm-sys" }
nvrm-abi = { path = "crates/nvrm-abi" }
nvrm-wire = { path = "crates/nvrm-wire" }

[profile.release]
debug = 1
