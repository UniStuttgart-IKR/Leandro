[workspace]
resolver = "2"
members = [
    "crates/nvrm-sys", "crates/nvrm-abi", "crates/nvrm-client",
    "crates/nvrm-wire", "crates/nvrm-trace", "crates/vhost-user-nvrm", "crates/vhost-user-input",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
rust-version = "1.82"

[workspace.dependencies]
libc = "0.2"
anyhow = "1"
thiserror = "2"
bindgen = "0.71"

# The vhost-user device side. Same versions cloud-hypervisor v53 pins (its Cargo.lock:
# vhost 0.16.0, vhost-user-backend 0.22.0, virtio-queue 0.17.0, vm-memory
# =0.17.1) so both ends of the socket speak the identical wire dialect.
vhost = { version = "0.16", features = ["vhost-user-backend"] }
vhost-user-backend = "0.22"
virtio-queue = "0.17"
vm-memory = "0.17.1"
vmm-sys-util = "0.15"

nvrm-sys   = { path = "crates/nvrm-sys" }
nvrm-abi = { path = "crates/nvrm-abi" }
nvrm-wire = { path = "crates/nvrm-wire" }

[profile.release]
debug = 1
