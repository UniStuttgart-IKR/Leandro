<svg width="680" height="451" viewBox="0 0 680 451" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Leandro guest/host architecture</title>
<desc>Guest VM without a GPU forwards ioctl calls through virtio_nvrm.ko to vhost-user-nvrm on the host, which drives the real nvidia.ko.</desc>
 
<rect x="0" y="0" width="680" height="451" fill="#FFFFFF"/>
 
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
 
<rect x="40" y="40" width="270" height="371" rx="20" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="60" y="62" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">Guest (VM, no GPU)</text>
<text x="60" y="80" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7">No direct GPU access</text>
 
<rect x="370" y="40" width="270" height="371" rx="20" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="390" y="62" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">Host (owns the GPU)</text>
<text x="390" y="80" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56">Runs the real driver</text>
 
<g>
<rect x="60" y="95" width="230" height="56" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="175" y="113" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Userspace</text>
<text x="175" y="131" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">nvidia-smi, libcuda.so</text>
</g>
<line x1="175" y1="151" x2="175" y2="175" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="185" y="167" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">ioctl</text>
 
<g>
<rect x="60" y="175" width="230" height="56" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="175" y="193" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Device nodes</text>
<text x="175" y="211" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">/dev/nvidiactl, nvidia-uvm</text>
</g>
<line x1="175" y1="231" x2="175" y2="255" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
 
<g>
<rect x="60" y="255" width="230" height="56" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="175" y="273" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">virtio_nvrm.ko</text>
<text x="175" y="291" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">Table interpreter</text>
</g>
<line x1="175" y1="311" x2="175" y2="335" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
 
<g>
<rect x="60" y="335" width="230" height="56" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="175" y="353" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">nvrm_nodes.ko</text>
<text x="175" y="371" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">Nodes, /proc, VA to GPA</text>
</g>
 
<g>
<rect x="390" y="255" width="230" height="56" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="505" y="273" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">vhost-user-nvrm</text>
<text x="505" y="291" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">Forwarder and translator</text>
</g>
<line x1="505" y1="311" x2="505" y2="335" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="515" y="327" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">real ioctl</text>
 
<g>
<rect x="390" y="335" width="230" height="56" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="505" y="353" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">nvidia.ko / nvidia-uvm</text>
<text x="505" y="371" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">Real GPU driver</text>
</g>
 
<line x1="310" y1="283" x2="370" y2="283" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="340" y="270" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">virtio</text>
</svg>
