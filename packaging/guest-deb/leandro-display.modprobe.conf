#
# A DESKTOP guest: uncomment both lines. virtio_nvrm then serves the kernel
# path NVKMS needs and presents it a virtual display of this size, and
# leandro-display.service loads NVIDIA's nvidia-drm on top before the display
# manager starts. vblank=1 is what a Wayland compositor needs.
#
# bdf_mediation=1: a streaming guest finds its DRM node by the PCI address
# CUDA reports. Without mediation that is the HOST's address, and Sunshine's
# NVENC path gives up (measured 2026-09-16: "Unable to find DRM device with
# PCI bus ID: 0000:2d:00.0", "Couldn't find any working encoder matching
# [nvenc]"). The first nvidia-smi after boot may still say "No devices found"
# (virtio_nvrm.c, bdf_mediation).
#
# The graphics userspace is Ubuntu's, at exactly the host's version (the
# package Suggests them): libnvidia-gl-610 (EGL, GLX, Vulkan),
# libnvidia-extra-610 (gbm/nvidia-drm_gbm.so, GBM for mutter and NVENC's GL
# interop) and libnvidia-encode-610 (NVENC).
#
#options virtio_nvrm display=1 vdisplay=1 bdf_mediation=1 vdisplay_width=1920 vdisplay_height=1080 vdisplay_vblank_hz=60
#options nvidia-drm modeset=1 vblank=1
