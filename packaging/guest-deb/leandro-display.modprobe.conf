#
# A DESKTOP guest: uncomment both lines. virtio_nvrm then serves the kernel
# path NVKMS needs and presents it a virtual display of this size, and
# leandro-display.service loads NVIDIA's nvidia-drm on top before the display
# manager starts. vblank=1 is what a Wayland compositor needs.
#
# bdf_mediation=1: a streaming guest finds its DRM node by the PCI address
# CUDA reports. Without mediation that is the HOST's address, and Sunshine's
# NVENC path gives up (measured 2026-09-16: "Unable to find DRM device with
# PCI bus ID: 0000:2d:00.0", "Couldn't find any working encoder matching
# [nvenc]"). The first nvidia-smi after boot may still say "No devices found"
# (virtio_nvrm.c, bdf_mediation).
#
# display_reserve_mib: the VRAM balloon. virtio_nvrm allocates this many MiB
# of the VM's VRAM itself, and gives it back to NVKMS the moment NVKMS is
# refused a display buffer (a window's or the cursor's scanout buffer), in the
# same call. -1, the default, sizes it from vdisplay_width x vdisplay_height:
# five scanout buffers of that size plus 1 MiB of cursor -- 44 MiB at
# 1920x1080, 76 at 2560x1440, 161 at 3840x2160, the highest point the display
# path reached above idle at those sizes. 0 turns it off, a positive number
# fixes it. It can be changed at runtime in
# /sys/module/virtio_nvrm/parameters/display_reserve_mib; dmesg says what
# the balloon holds and every time it gives something back.
#
# Why: the host allows this VM a fixed amount of VRAM, and a game fills it.
# Measured 2026-09-17 on a 2816 MiB guest with Shadow of the Tomb Raider,
# Steam and Sunshine: the picture froze in 7 of 9 benchmark runs, for 132 to
# 193 s until the game exited, and in exactly the runs where one 8.4 MiB
# scanout buffer for the game's window was refused. Xwayland does not recover
# from that, and nothing on a real NVIDIA card does it for the desktop
# either. Reporting a smaller card to the programs (tried the same day) did
# not help: the game's budget did not follow it. The balloon holds the room
# instead: programs reach the limit that much earlier, the display does not.
# The balloon shows as used memory without a process in nvidia-smi.
#
# The graphics userspace is Ubuntu's, at exactly the host's version (the
# package Suggests them): libnvidia-gl-610 (EGL, GLX, Vulkan),
# libnvidia-extra-610 (gbm/nvidia-drm_gbm.so, GBM for mutter and NVENC's GL
# interop) and libnvidia-encode-610 (NVENC).
#
#options virtio_nvrm display=1 vdisplay=1 bdf_mediation=1 vdisplay_width=1920 vdisplay_height=1080 vdisplay_vblank_hz=60 display_reserve_mib=-1
#options nvidia-drm modeset=1 vblank=1
