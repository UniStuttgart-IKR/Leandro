#
# A DESKTOP guest: uncomment both lines. virtio_nvrm then serves the kernel
# path NVKMS needs and presents it a virtual display of this size, and
# leandro-display.service loads NVIDIA's nvidia-drm on top before the display
# manager starts. vblank=1 is what a Wayland compositor needs.
#
# bdf_mediation=1: a streaming guest finds its DRM node by the PCI address
# CUDA reports. Without mediation that is the HOST's address, and Sunshine's
# NVENC path gives up (measured 2026-09-16: "Unable to find DRM device with
# PCI bus ID: 0000:2d:00.0", "Couldn't find any working encoder matching
# [nvenc]"). The first nvidia-smi after boot may still say "No devices found"
# (virtio_nvrm.c, bdf_mediation).
#
# display_reserve_mib: how many MiB LESS VRAM the guest's programs are told
# the card has than the host allows this VM. -1, the default, sizes it from
# vdisplay_width x vdisplay_height: five scanout buffers of that size plus
# 1 MiB of cursor -- 44 MiB at 1920x1080, 76 at 2560x1440, 161 at 3840x2160.
# 0 turns it off, a positive number fixes it. It can be changed at runtime in
# /sys/module/virtio_nvrm/parameters/display_reserve_mib; programs that
# already sized themselves keep what they read.
#
# Why: programs that plan their VRAM (Vulkan's memory budget, game engines,
# Chromium) size themselves from what the card reports, and the desktop
# allocates buffers on demand -- Xwayland's buffers for a fullscreen window,
# gnome-shell's transition copies, the cursor. Measured 2026-09-17 on a 2816
# MiB guest with Shadow of the Tomb Raider: one refused 8.4 MiB scanout buffer
# for the game's window stopped the picture until the game exited. The five
# buffers are the highest point the display path reached above idle at each
# size (an X11 fullscreen start, 4.7 buffers at 3840x2160). The host still
# enforces its limit; the reserve only makes programs that plan leave the
# room, so a program that ignores the reported size can still use it up.
#
# And said plainly: for that game it did not help. nvidia-smi and Vulkan's
# heap and budget moved by exactly the reserve, but the game's own budget did
# not shrink and Steam's web helper grew into the room; the picture froze in
# 2 of 3 runs with the auto value and in 2 of 3 without.
#
# The graphics userspace is Ubuntu's, at exactly the host's version (the
# package Suggests them): libnvidia-gl-610 (EGL, GLX, Vulkan),
# libnvidia-extra-610 (gbm/nvidia-drm_gbm.so, GBM for mutter and NVENC's GL
# interop) and libnvidia-encode-610 (NVENC).
#
#options virtio_nvrm display=1 vdisplay=1 bdf_mediation=1 vdisplay_width=1920 vdisplay_height=1080 vdisplay_vblank_hz=60 display_reserve_mib=-1
#options nvidia-drm modeset=1 vblank=1
