#
# Leandro's guest side as ONE dkms package: nvrm_nodes and virtio_nvrm, and
# NVIDIA's own nvidia-modeset and nvidia-drm built against virtio_nvrm. One
# package because nvidia-modeset links against virtio_nvrm's Module.symvers,
# and inside one build tree that is a fixed relative path (Makefile).
PACKAGE_NAME="leandro-guest"
PACKAGE_VERSION="@VERSION@"
AUTOINSTALL="yes"

# 'make' in quotes, as NVIDIA's own kernel-open/dkms.conf spells it: dkms
# appends KERNELRELEASE= to a command that starts with a bare `make`, every
# sub-make inherits it, and kernel-open/Makefile then believes Kbuild is
# reading it ("Makefile:18: /Kbuild: No such file or directory", measured).
MAKE[0]="'make' KDIR=${kernel_source_dir} KERNEL_UNAME=${kernelver}"
CLEAN="'make' KDIR=${kernel_source_dir} KERNEL_UNAME=${kernelver} clean"

BUILT_MODULE_NAME[0]="nvrm_nodes"
BUILT_MODULE_LOCATION[0]="nvrm_nodes/"
DEST_MODULE_LOCATION[0]="/updates/dkms"

BUILT_MODULE_NAME[1]="virtio_nvrm"
BUILT_MODULE_LOCATION[1]="virtio_nvrm/"
DEST_MODULE_LOCATION[1]="/updates/dkms"

BUILT_MODULE_NAME[2]="nvidia-modeset"
BUILT_MODULE_LOCATION[2]="nvkms/kernel-open/"
DEST_MODULE_LOCATION[2]="/updates/dkms"

BUILT_MODULE_NAME[3]="nvidia-drm"
BUILT_MODULE_LOCATION[3]="nvkms/kernel-open/"
DEST_MODULE_LOCATION[3]="/updates/dkms"

# Built and measured on 6.8; 6.12 and 6.13 need the version guards that are
# in the tree; 6.15 removed hrtimer_init and 6.18 nth_page, neither is done
# (nix/packages/guest-modules.nix). A kernel outside this is refused by dkms
# rather than failing half way through a build.
BUILD_EXCLUSIVE_KERNEL="^6\.([4-9]|1[0-4])\."
