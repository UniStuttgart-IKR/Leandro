#
# The guest runs no NVIDIA kernel driver; virtio_nvrm is its nvidia.ko.
blacklist nvidia
blacklist nvidia_uvm
# virtio_nvrm owns the device nodes, nvrm_nodes only /proc/driver/nvidia.
options nvrm_nodes create_nodes=0
softdep virtio_nvrm pre: nvrm_nodes
