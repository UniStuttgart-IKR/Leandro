# GPU-free checks. Hardware gates run separately on the test rig.
name: check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Install pinned clang-format
        run: |
          pipx install clang-format==22.1.8
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: C formatting
        run: tools/ci/check-c-format.sh

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev pkg-config git curl edid-decode

      - name: Install pinned Rust
        run: rustup show active-toolchain

      - name: Cache (cargo + vendor headers)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            vendor/open-gpu-kernel-modules
          key: check-ubuntu24-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'DRIVER_VERSION', 'crates/nvrm-sys/abi.toml') }}

      - name: Fetch NVIDIA headers at DRIVER_VERSION
        run: ./tools/build.sh vendor

      - name: Software checks
        run: ./tools/check.sh

      - name: C host tools and frame fixtures
        run: tools/ci/check-c.sh host-tools

  c-sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 libclang-rt-18-dev edid-decode
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: c-sanitizers-ubuntu24-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: C tests with ASan and UBSan
        env:
          CC: clang-18
        run: tools/ci/check-c.sh all --sanitize

  c-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Ubuntu 6.8 kernel headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential linux-headers-generic
      - name: Build both guest modules
        run: |
          kdir=$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-6.8.*-generic' | sort -V | tail -1)
          test -n "$kdir"
          make -C guest-module/nvrm_nodes KDIR="$kdir" KCFLAGS=-Werror
          make -C guest-module/virtio_nvrm KDIR="$kdir" KCFLAGS=-Werror

  workflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate GitHub Actions
        run: |
          curl -fLsS https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint"

  shell:
    # Its own job: shellcheck needs no Rust, no NVIDIA headers and no cache,
    # so it answers in seconds and says which of the bands broke without
    # waiting for the others.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: ShellCheck (pinned)
        # The distribution package moves between Ubuntu images, and a
        # shellcheck that gains a check turns this job red on a commit that
        # touched nothing. Pinned by version AND by hash: a pinned version
        # whose artifact can be replaced is a version number, not a pin.
        run: |
          set -euo pipefail
          ver=v0.10.0
          sha=6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
          url=https://github.com/koalaman/shellcheck/releases/download/$ver/shellcheck-$ver.linux.x86_64.tar.xz
          curl -sSLo /tmp/shellcheck.tar.xz "$url"
          echo "$sha  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -C /tmp -xf /tmp/shellcheck.tar.xz
          sudo install -m755 "/tmp/shellcheck-$ver/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: Files
        # The same list check.sh's `bash -n` walks: every .sh under
        # tools/ plus the extensionless shebang scripts there.
        run: |
          git ls-files 'tools/**' 'tools/*' \
            | while IFS= read -r p; do
                case "$p" in *.sh) echo "$p"; continue ;; esac
                [ -f "$p" ] && head -c 64 "$p" | head -1 \
                  | grep -qE '^#!.*(bash|sh)$' && echo "$p"
              done > /tmp/shell-files.txt
          cat /tmp/shell-files.txt

      - name: Errors, everywhere (blocking)
        # Severity `error` is shellcheck's "this is a bug or does not parse".
        # It is clean across the whole tree and must stay that way -- the
        # last one found here was a `# shellcheck disable=...  -- reason`
        # directive whose trailing prose made shellcheck give up on the file
        # and, through it, on every script that sourced it.
        run: xargs -a /tmp/shell-files.txt shellcheck -x -S error

      - name: Warnings in the library and test entry points (blocking)
        # The files every other script builds on are held to `warning`: the
        # library, test.sh and check.sh. Clean since the 2026-08-18 consolidation, so
        # there is no backlog to grandfather in.
        run: shellcheck -x -S warning tools/*.sh tools/ci/*.sh

      - name: Warnings elsewhere (advisory, never blocking)
        # Printed on every run so a new finding stays visible, blocking on
        # nothing so it cannot hold up unrelated work. Clean as of
        # 2026-08-18: the SC2164 backlog closed with the consolidation --
        # every script resolves LEA_ROOT and works with absolute paths.
        continue-on-error: true
        run: |
          xargs -a /tmp/shell-files.txt shellcheck -x -S warning \
            || echo "advisory: see the findings above (this step never fails the build)"

  nix:
    # The Nix package builds both guest modules against Linux 6.12.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d # v16
      - name: nix flake check
        run: nix flake check --no-build --no-update-lock-file
      - name: Build shared C test tools
        run: nix build .#test-tools --no-link --no-update-lock-file
      - name: Build guest modules (Linux 6.12)
        run: nix build .#guest-modules --no-link --no-update-lock-file
