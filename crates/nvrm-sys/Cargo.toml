[package]
name = "nvrm-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Generated bindings to the NVIDIA RM/UVM driver ABI, one module per supported driver version"

[lib]
# Nothing to doctest in generated bindings; the header comments that once
# broke `cargo test --doc` are stripped at the source -- the generator runs
# bindgen with generate_comments(false) for exactly that reason.
doctest = false

[dependencies]

# BEGIN generated by cargo xtask abi
[features]
# One feature per driver version, and they are ADDITIVE: each enables its
# module and disables nothing. There is deliberately no "select exactly
# one version" feature -- cargo unifies features across a build, so such a
# thing would turn one crate's choice into everyone's, silently.
# All of them at once must compile; that is checked in CI.
default = ["v610"]
v580 = []
v595 = []
v610 = []
v615 = []
# END generated by cargo xtask abi
