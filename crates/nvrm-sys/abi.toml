#
# The two hand-maintained inputs of the multi-version ABI, and the only ones.
# Everything else under this crate that describes a driver version is
# generated by `cargo xtask abi` from this file and from the vendored headers
# it points at.
#
#   adding a driver version  -> one [versions.*] entry below
#   intercepting a new ioctl -> one pattern in [footprint]
#
# Nothing here says what a struct LOOKS like. Layouts are measured from the
# headers, written to manifests/<version>.json, and compared; a layout that
# cannot be derived is an error the generator raises, never a number somebody
# types in here.

# ---------------------------------------------------------------------------
# Versions
# ---------------------------------------------------------------------------
# One entry per driver version the crate can be built for. `headers` names the
# upstream tag, which is also the directory under vendor/nvidia-rm-headers/;
# the exact commit and the licence are recorded there, in PROVENANCE, beside
# the bytes they describe.
#
# `branch` is informational. Datacenter drivers are not a separate mechanism:
# they are tagged minor releases of the same branch numbers, so they arrive
# here as additional entries and nothing else changes.
#
# ONE ENTRY PER BRANCH, AND IT IS THE BRANCH'S LATEST MINOR RELEASE. An older
# minor is supported only if its manifest MATCHES the entry, and it then needs
# no entry of its own -- it is the same bytes. If it does not match it is not
# supported, and that is deliberate: a refusal is recoverable and a wrong
# offset is not.
#
# Do not read "branch" as "layout". Measured 2026-09-14 over twelve tags:
# 580.167.08, 580.173.02 and 580.178.04 are identical to each other, and so
# are 595.91.07 and 595.99.02 -- but inside R610, 610.43.02 and 610.43.03 are
# identical to each other and NOT to 610.57.04, which appended eight bytes to
# NV0080_CTRL_FB_GET_COMPBIT_STORE_INFO_PARAMS. So R610 carries two layouts
# and only the later one is here. See OPEN-QUESTIONS number 72.
#
# When NVIDIA ships the next minor of a branch, that becomes the entry. If its
# manifest differs from the one leaving, the version leaving stops being
# supported -- keep BOTH entries instead if somebody is still running it.
# manifests/<version>.json of a version that has left stays as history; it is
# no longer regenerated, and `cargo xtask abi` says so on every run.

[versions."580.178.04"]
headers = "open-gpu-kernel-modules@580.178.04"
branch  = "R580 production"

[versions."595.99.02"]
headers = "open-gpu-kernel-modules@595.99.02"
branch  = "R595 production"

# Acknowledged breakages at this version. The key is a mediated struct whose
# layout moved here; the value is the module it takes. This does not DESCRIBE
# the layout -- that is still measured from the headers -- it records that a
# person looked at the move and accepted it.
[versions."595.99.02".layout]
# The card's name. The params block went 132 -> 68 bytes because its buffer
# did, and the buffer changed SHAPE: on 580.178.04 it is a union of a
# 128-byte `ascii` and a `unicode` member, from 595.99.02 a plain struct with
# `ascii` alone at 64 bytes. `mediate.rs` takes NAME_MAX from that size and
# writes the guest's name into it, so this is the bound of a copy.
# OPEN-QUESTIONS number 54.
NV2080_CTRL_GPU_GET_NAME_STRING_PARAMS = "v595"
NV2080_CTRL_GPU_GET_NAME_STRING_PARAMS__bindgen_ty_1 = "v595"
# UVM, both on the semaphore-pool path. FREE lost `length`; UNREGISTER_CHANNEL
# lost the 16-byte `gpuUuid` from the FRONT, so every field behind it moved.
UVM_FREE_PARAMS = "v595"
UVM_UNREGISTER_CHANNEL_PARAMS = "v595"
# Same size, same offsets, different spelling: the per-row typedef
# NV0000_CTRL_P2P_CAPS_MATRIX_ROW became a plain [[NvU32; 8]; 8]. Nothing on
# the wire moved. It is acknowledged rather than ignored because the generator
# cannot tell a renamed row type from a reshaped one, and a person can.
NV0000_CTRL_SYSTEM_GET_P2P_CAPS_MATRIX_PARAMS = "v595"

[versions."610.57.04"]
headers = "open-gpu-kernel-modules@610.57.04"
branch  = "R610 production"

[versions."610.57.04".layout]
# The one that would corrupt a real call: hHandleVASpace was inserted at
# offset 32 and twenty fields moved four or eight bytes behind it. The comment
# in crates/nvrm-abi/src/nvgpu.rs has named this boundary since before there
# was a generator.
NV_CHANNEL_ALLOC_PARAMS = "v610"

[versions."615.71.09"]
headers = "open-gpu-kernel-modules@615.71.09"
branch  = "R615 feature"

# ---------------------------------------------------------------------------
# Footprint
# ---------------------------------------------------------------------------
# What this crate binds, and therefore what the generator has to be able to
# answer for on every version above. The patterns are bindgen's own allowlist
# regexes, anchored the way bindgen anchors them, and they are handed to
# bindgen verbatim -- there is no glob dialect in between that could mean
# something slightly different from what the binding does.
#
# The patterns are the hand-maintained part; the NAMES they resolve to are
# not. manifests/<version>.json lists every name, its size, its alignment and
# every field offset, per version, and that file is the evidence rather than
# this one.
#
# Widening a pattern widens the surface that has to be carried across five
# driver versions. If a symbol is missing, add a pattern for it; do not turn
# an existing one into a catch-all.

[footprint]

structs = [
    "NVOS.*",
    "NV0000_CTRL_.*",   # root-client controls: probed ids, PCI info
    "NV0080_.*",
    "NV2080_.*",
    "NV_MEMORY_ALLOCATION_PARAMS",
    # OS_DESCRIPTOR uses its OWN, smaller params struct (40 bytes instead of
    # 128). Without this entry the size would have to be maintained by hand,
    # and treating it as the 128-byte struct is an 88-byte over-read.
    "NV_OS_DESC_MEMORY_ALLOCATION_PARAMS",
    # The allocation parameter blocks that live in nvos.h. The header was
    # already included for NVOS21/33/46/54/64; these types were filtered out
    # by the allowlist, which meant `xlate::alloc_param_size` had to carry
    # their sizes as arithmetic done by hand while reading the header. One
    # line each turns about forty of those entries into numbers the compiler
    # checks -- see the test in xlate.rs. The guest module copies exactly that
    # many bytes on every allocation, so a wrong one truncates a request or
    # reads out of bounds, identically on both sides of the boundary and
    # therefore invisibly to any sweep.
    "NV_GR_ALLOCATION_PARAMETERS",        # graphics/compute
    # NV_BSP_/NV_MSENC_ are #defines onto these two, so bindgen only ever sees
    # the real names (nvos.h:2945, :2994).
    "NV_NVDEC_ALLOCATION_PARAMETERS",     # NVDEC
    "NV_NVENC_ALLOCATION_PARAMETERS",     # NVENC
    # The same two structs under the names they had before 610.43.02, so that
    # the older versions bind them at all. [footprint.renamed] below carries
    # them back to one name.
    "NV_BSP_ALLOCATION_PARAMETERS",
    "NV_MSENC_ALLOCATION_PARAMETERS",
    "NV_OFA_ALLOCATION_PARAMETERS",       # optical flow
    "NV_NVJPG_ALLOCATION_PARAMETERS",     # JPEG
    "NV_CONTEXT_DMA_ALLOCATION_PARAMS",   # NV01_CONTEXT_DMA
    "NV_HOPPER_USERMODE_A_PARAMS",
    "NV_VIDMEM_ACCESS_BIT_ALLOCATION_PARAMS",
    # ... and the ones that live in their own class headers.
    "NVB0B5_ALLOCATION_PARAMETERS",
    "NV_MEMORY_VIRTUAL_ALLOCATION_PARAMS",
    "NV9072_ALLOCATION_PARAMETERS",
    "NV2081_ALLOC_PARAMETERS",
    "NV_MEMORY_MAPPER_ALLOCATION_PARAMS",
    "NV00DE_ALLOC_PARAMETERS",
    "NV_CONFIDENTIAL_COMPUTE_ALLOC_PARAMS",
    "NV83DE_ALLOC_PARAMETERS",
    "NV_SEMAPHORE_SURFACE_ALLOC_PARAMETERS",
    "NVC640_ALLOCATION_PARAMETERS",
    "NVA0BC_ALLOC_PARAMETERS",
    "NV_PHYSICAL_MEMORY_ALLOCATION_PARAMS",
    "NV_MEMORY_SYNCPOINT_ALLOCATION_PARAMS",
    "NV_VASPACE_ALLOCATION_PARAMETERS",
    "NV_CHANNEL_ALLOC_PARAMS",
    "NV_CHANNELGPFIFO_ALLOCATION_PARAMETERS",
    "NV_CHANNEL_GROUP_ALLOCATION_PARAMETERS",   # cla06c.h
    "NV_CTXSHARE_ALLOCATION_PARAMETERS",        # cl9067.h
    "NVA06C_CTRL_.*",
    "NVA083_CTRL_.*",
    "NVC36F_CTRL_.*",
    "nv_ioctl_.*",
    # /dev/nvidia-modeset carries ONE ioctl number, and the command is a field
    # inside this 16-byte struct (nvkms-ioctl.h). The tracer reads that field,
    # so the offsets are a layout guard here rather than two numbers written
    # into the reader.
    "NvKmsIoctlParams",
    "nv_pci_info_t",
    "nv_ioctl_card_info_t",     # NV_ESC_CARD_INFO: the BDF as an ioctl, not a control
    # The semaphore-surface waiter controls (ctrl00da.h): the guest module and
    # the backend both key on cmd + notificationHandle.
    "NV_SEMAPHORE_SURFACE_CTRL_.*",
    "NvUnixEvent",              # what GET_EVENT_DATA writes (nvos.h)
    "NV0005_ALLOC_PARAMETERS",  # event alloc params (cl0005.h)
    # UVM: param structs including their layout tests, and the
    # mapping-attribute enums.
    "UVM_.*_PARAMS",
    "Uvm.*",
    # GET_GID_INFO: the params struct. The DRF positions of its flags are
    # colon macros in the header and do not survive bindgen --
    # FORMAT_BINARY/TYPE_SHA1 are spelled out in the calling code.
    "NV2080_CTRL_GPU_GET_GID_INFO_PARAMS",
]

constants = [
    "NVKMS_IOCTL_.*",
    "NV_ESC_.*",
    "NV_IOCTL_.*",
    "NV01_.*",
    "NV04_.*",   # op codes carried by the in-kernel RM API
    "NV0000_CTRL_.*",
    "NV0000_CTRL_GPU_INVALID_ID",
    "NV_MAX_DEVICES",
    "NV20_.*",
    "NV2080_CTRL_CMD_OS_UNIX_.*",
    "NV0080_CTRL_CMD_OS_UNIX_.*",
    # The virtual display: the class NVKMS takes when a GPU has no connectors,
    # and the six controls the class defines (NVKMS asks three of them).
    "NVA083_.*",
    "NV9010_.*",     # the vblank callback class + its one control
    "NV_SEMAPHORE_SURFACE_CTRL_CMD_.*",
    "NV2080_NOTIFIERS_.*",       # notifier indices the event path filters
    "NV0080_CTRL_CMD_GPU_GET_CLASSLIST",
    "NV_MEMORY_.*",
    "NV_CTXSHARE_.*",                            # context-share flags
    "NV2080_ENGINE_TYPE_.*",                     # engine ids for TSG/channel allocs
    "NV2080_CTRL_CMD_BUS_.*",                    # BUS_GET_INFO_V2: where NVML reads the BDF
    "NV2080_CTRL_BUS_INFO_.*",                   # its index list
    "NVOS.*_FLAGS_.*",
    "NVOS32_.*",
    "FERMI_.*",        # FERMI_VASPACE_A and FERMI_CONTEXT_SHARE_A
    "KEPLER_.*",       # KEPLER_CHANNEL_GROUP_A
    "VOLTA_.*",
    # TURING_CHANNEL_GPFIFO_A and TURING_USERMODE_A; without the latter there
    # is no doorbell page.
    "TURING_.*",
    "AMPERE_CHANNEL_GPFIFO_A",
    "NVC361_.*",
    "NVC36F_.*",
    "NVC46F_.*",
    "NVA06C_.*",
    "NV_RM_API_VERSION_.*",
    "NV_OK",
    "NV_ERR_.*",
    "NV_CHANNELGPFIFO_.*",
    "NV50_.*",
    "UVM_.*",
    "UvmGpu.*",
    "NV2080_CTRL_CMD_GPU_GET_GID_INFO",
    "NV2080_GPU_.*GID.*",
]

# ---------------------------------------------------------------------------
# The mediated core
# ---------------------------------------------------------------------------
# The types the boundary reads AND that are not identical on every supported
# version. Left of the equals sign is the name the type gets in `RmAbi`; right
# of it is what NVIDIA calls it.
#
# Why this list exists at all, in one number: the footprint binds over a
# thousand types, and 358 of them differ somewhere between 580.178.04 and
# 615.71.09 -- almost all of them internal controls nothing here intercepts.
# Ten are on a path this code touches. Abstracting over 358 would be a trait
# nobody can read, and a refusal per breaking struct would be hundreds of
# acknowledgements a year. So the generator abstracts over, and refuses on,
# THIS list.
#
# It cannot quietly fall behind: `cargo xtask abi` reads every `sys::NAME` the
# workspace writes, and stops if one of them is volatile and missing here.
#
# A type that does not move must NOT be listed. It lives in src/stable.rs and
# is used directly -- that is the rule the crate shape rests on.

[footprint.mediated]
# The channel allocation. 368 bytes through 595.99.02, 376 from 610.43.02:
# hHandleVASpace was inserted at offset 32 and seventeen fields moved behind
# it. This is the one that would corrupt a real call.
AllocChannelParams = "NV_CHANNEL_ALLOC_PARAMS"
# The TSG (channel group) allocation. 20 bytes through 610.57.04, 28 on
# 615.71.09, where `reserved` and `internalFlags` were APPENDED -- old offsets
# unchanged, so the generator can carry it without being told.
TsgParams = "NV_CHANNEL_GROUP_ALLOCATION_PARAMETERS"
# The card's name. 132 bytes on 580.178.04 and 68 from 595.99.02: the string
# buffer went from 128 to 64 bytes. OPEN-QUESTIONS number 54 is about what the
# guest sees in this field, which is why it is on the list.
GpuNameStringParams = "NV2080_CTRL_GPU_GET_NAME_STRING_PARAMS"
# Its inner buffer, on the list for its own sake because `mediate.rs` takes
# NAME_MAX from its size: 128 bytes on 580.178.04, 64 from 595.99.02. The
# mediation writes the guest's name into that many bytes, so the number is the
# bound of a memcpy and not a label.
GpuNameStringBuffer = "NV2080_CTRL_GPU_GET_NAME_STRING_PARAMS__bindgen_ty_1"
# UVM. Both shrank at 595.99.02 and both are on the semaphore-pool path.
UvmFreeParams = "UVM_FREE_PARAMS"
UvmUnregisterChannelParams = "UVM_UNREGISTER_CHANNEL_PARAMS"
# Same size on every version and NOT the same type: the per-row typedef became
# a plain two-dimensional array at 595.99.02. Nothing about the bytes moved,
# and the mediation reads the rows, so it is here to be looked at rather than
# because it is known to be dangerous.
P2pCapsMatrixParams = "NV0000_CTRL_SYSTEM_GET_P2P_CAPS_MATRIX_PARAMS"
# NV_NVDEC_/NV_NVENC_ALLOCATION_PARAMETERS and NV0080_CTRL_NVENC_GET_CAPS_PARAMS
# were here while they read as version-specific. They are not: they were
# RENAMED at 610.43.02 and are byte for byte the same on every version, which
# [footprint.renamed] now says and the classifier now agrees with. They are in
# src/stable.rs and are used directly.

# ---------------------------------------------------------------------------
# Renames
# ---------------------------------------------------------------------------
# NVIDIA renames a type and keeps the old spelling as a macro. bindgen only
# ever sees the surviving name, so one version binds `NV_BSP_...` and the next
# binds `NV_NVDEC_...` and nothing in the bytes changed at all. Without this
# table the classifier can only report "absent in one, new in the other",
# which is the same shape a genuinely deleted struct has, and `RmAbi` cannot
# have an associated type for something one version does not name.
#
# The left side is the name this crate uses -- NVIDIA's current one. The right
# side is what to look for in that version's headers. The rename is applied
# before anything is measured, so the manifests, the classification and the
# generated modules all speak one name, and `renames` in each manifest records
# what it was called there.
#
# This is a claim that two names are the same TYPE, and it is checked: once
# renamed, the two must classify as identical, or the classifier reports the
# difference the way it would for any other struct.
#
# OPEN-QUESTIONS number 73.

[footprint.renamed]
# Renamed at 610.43.02 (nvos.h:2945, :2994 keep the old names as #defines).
NV_NVDEC_ALLOCATION_PARAMETERS = { "580.178.04" = "NV_BSP_ALLOCATION_PARAMETERS", "595.99.02" = "NV_BSP_ALLOCATION_PARAMETERS" }
NV_NVENC_ALLOCATION_PARAMETERS = { "580.178.04" = "NV_MSENC_ALLOCATION_PARAMETERS", "595.99.02" = "NV_MSENC_ALLOCATION_PARAMETERS" }
# The header moved with it: ctrl0080msenc.h became ctrl0080nvenc.h. Same two
# fields, same command number 0x801b01.
NV0080_CTRL_NVENC_GET_CAPS_PARAMS = { "580.178.04" = "NV0080_CTRL_MSENC_GET_CAPS_PARAMS", "595.99.02" = "NV0080_CTRL_MSENC_GET_CAPS_PARAMS" }

# ---------------------------------------------------------------------------
# The mediated constants
# ---------------------------------------------------------------------------
# Same idea as [footprint.mediated] and a different shape, because a constant
# has no layout to abstract over -- it has a VALUE, and on some versions it
# has none at all. These are emitted as `Option<u32>` on `RmAbi`, so a version
# that does not define the name says `None` and a caller has to decide what
# that means instead of the compiler hiding the question.
#
# All seven are the virtual display. `NVA083_GRID_DISPLAYLESS` and its five
# controls arrive with R595: 580.178.04's SDK has neither class/cla083.h nor
# ctrl/ctrla083.h, so on 580 every one of these is `None` and the generated
# guest header carries no virtual-display block. Whether that means the
# display path is merely absent there or shaped differently is OPEN-QUESTIONS
# number 74, and it is not answered by this table -- this table only stops the
# code from pretending the numbers exist.

[footprint.mediated_constants]
CLASS_DISPLAYLESS = "NVA083_GRID_DISPLAYLESS"
CTRL_VD_GET_NUM_HEADS = "NVA083_CTRL_CMD_VIRTUAL_DISPLAY_GET_NUM_HEADS"
CTRL_VD_GET_MAX_RESOLUTION = "NVA083_CTRL_CMD_VIRTUAL_DISPLAY_GET_MAX_RESOLUTION"
CTRL_VD_GET_MAX_PIXELS = "NVA083_CTRL_CMD_VIRTUAL_DISPLAY_GET_MAX_PIXELS"
CTRL_VD_GET_DEFAULT_EDID = "NVA083_CTRL_CMD_VIRTUAL_DISPLAY_GET_DEFAULT_EDID"
CTRL_VD_IS_ACTIVE = "NVA083_CTRL_CMD_VIRTUAL_DISPLAY_IS_ACTIVE"
CTRL_VD_IS_CONNECTED = "NVA083_CTRL_CMD_VIRTUAL_DISPLAY_IS_CONNECTED"
