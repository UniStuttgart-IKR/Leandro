[package]
name = "nvrm-trace"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LD_PRELOAD tracer for the NVIDIA ioctl surface; a measuring instrument, not a data path"

[lib]
name = "nvrm_trace"
crate-type = ["cdylib"]

# BEGIN generated by cargo xtask abi
[features]
# One feature per driver version, and they are ADDITIVE: each enables its
# module and disables nothing. There is deliberately no "select exactly
# one version" feature -- cargo unifies features across a build, so such a
# thing would turn one crate's choice into everyone's, silently.
# All of them at once must compile; that is checked in CI.
default = ["v615"]
v580 = ["nvrm-sys/v580"]
v595 = ["nvrm-sys/v595"]
v610 = ["nvrm-sys/v610"]
v615 = ["nvrm-sys/v615"]
# END generated by cargo xtask abi

[dependencies]
libc.workspace = true
nvrm-abi.workspace = true
nvrm-sys.workspace = true
