[package]
name = "vhost-user-nvrm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The virtio-nvrm host backend: forwards and translates guest RM calls onto the real driver"

[lib]
name = "vhost_user_nvrm"
path = "src/lib.rs"

[[bin]]
name = "vhost-user-nvrm"
path = "src/main.rs"

# BEGIN generated by cargo xtask abi
[features]
# One feature per driver version, and they are ADDITIVE: each enables its
# module and disables nothing. There is deliberately no "select exactly
# one version" feature -- cargo unifies features across a build, so such a
# thing would turn one crate's choice into everyone's, silently.
# All of them at once must compile; that is checked in CI.
default = ["v610"]
v580 = ["nvrm-sys/v580"]
v595 = ["nvrm-sys/v595"]
v610 = ["nvrm-sys/v610"]
v615 = ["nvrm-sys/v615"]
# END generated by cargo xtask abi

[dependencies]
libc.workspace = true
anyhow.workspace = true
nvrm-sys.workspace = true
nvrm-abi.workspace = true
nvrm-wire = { workspace = true, features = ["std"] }

# The virtio-nvrm device side (src/nvrm.rs).
vhost.workspace = true
vhost-user-backend.workspace = true
virtio-queue.workspace = true
vm-memory.workspace = true
vmm-sys-util.workspace = true
