[package]
name = "vhost-user-nvrm-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Deliberately NOT a workspace member: the fuzz target needs nightly and
# -Zsanitizer, while the rest of the tree builds on the pinned stable
# toolchain (rust-toolchain.toml).
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
libc = "0.2"

[dependencies.vhost-user-nvrm]
path = ".."

[[bin]]
name = "handle_msg"
path = "fuzz_targets/handle_msg.rs"
test = false
doc = false
bench = false
