[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Repository automation. `cargo xtask abi` generates the multi-version RM bindings."
publish = false

[dependencies]
anyhow.workspace = true
bindgen.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Parse bindgen layouts and workspace binding uses.
syn = { version = "2", features = ["full", "parsing", "printing", "visit"] }
quote = "1"
proc-macro2 = "1"
prettyplease = "0.2"
sha2 = "0.10"
